name: PR 7 validation

# Validates the current PR head; temporary workflow lives only on this CI branch.

on:
  push:
    branches:
      - ci/pr7-validation

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available

      - name: Checkout PR branch
        run: |
          git clone --branch fix/replay-played-queue-items https://github.com/GerardRodes/yourpods-source.git repo
          cd repo
          git remote add upstream https://github.com/asecretcompany/yourpods-source.git
          git fetch --depth 1 upstream main

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: repo
        run: xcodegen generate

      - name: Diff whitespace check
        working-directory: repo
        run: git diff --check upstream/main...HEAD

      - name: Smoke tests
        working-directory: repo
        run: |
          xcodebuild test             -scheme YourPods             -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'             -testPlan Smoke

      - name: Full merge gate
        working-directory: repo
        run: |
          xcodebuild test             -scheme YourPods             -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'

