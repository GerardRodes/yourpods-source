name: PR 7 targeted relisten tests

on:
  push:
    branches:
      - ci/pr7-targeted

jobs:
  relisten:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        run: |
          git clone --branch fix/replay-played-queue-items https://github.com/GerardRodes/yourpods-source.git repo

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: repo
        run: xcodegen generate

      - name: Relisten tests
        working-directory: repo
        run: |
          xcodebuild test             -scheme YourPods             -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'             -only-testing:YourPodsTests/RelistenPlaybackTests

